name: Verify dev release acceptance
run-name: WSS acceptance matlab-wrapper ${{ inputs.plan_id }}
on:
  workflow_dispatch:
    inputs:
      producer_run_id: {required: true, type: string}
      plan_id: {required: true, type: string}
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: acceptance-matlab-wrapper-${{ inputs.plan_id }}
  cancel-in-progress: false
jobs:
  receipt:
    name: Verify exact reviewed dev acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Require reviewed native readiness and dev reconciliation before credentials
        shell: pwsh
        run: |
          $config=Get-Content source/.github/matlab-ci.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF -cne 'refs/heads/dev' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $config.baseline_ready -cne $true -or $config.candidate_preflight_ready -cne $true) { throw 'Live MATLAB acceptance remains disabled.' }

      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: 0fb9ae74504e03dc63777ed70a6ec51c4369d5ab
          path: contract
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore,Matlab_WSS_Integration_Lib,CLI_Matlab_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Verify frozen plan, native proofs, actual merge and fresh committed-state CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          TARGET_ID: matlab-wrapper
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          node ./source/.github/scripts/Write-ReleaseReceipt.mjs "$env:GITHUB_WORKSPACE/source" "$env:GITHUB_WORKSPACE/source" "$env:GITHUB_WORKSPACE/contract" "$env:RUNNER_TEMP/matlab-receipt"
          if ($LASTEXITCODE -ne 0) { throw 'Read-only native acceptance verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: wss-acceptance-matlab-wrapper-${{ inputs.plan_id }}-a${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/matlab-receipt/receipt.json
