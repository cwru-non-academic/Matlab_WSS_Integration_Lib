name: WSS integration compatibility
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavioral-tests:
    name: Integration behavioral tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the committed wrapper host
        shell: pwsh
        run: |
          dotnet build managed/Wss.Matlab.Managed.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed host build failed.' }
      - name: Set up MATLAB using normal public-project licensing
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Load existing Core DLL directly from native MATLAB tests
        uses: matlab-actions/run-command@v3
        with:
          command: dotnetenv('core', Version='8'); addpath('src'); results = runtests('tests/TestManagedRuntime.m'); assertSuccess(results);
