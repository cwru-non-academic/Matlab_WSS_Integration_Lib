name: WSS integration compatibility
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavioral-tests:
    name: Integration behavioral tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify MATLAB promotion rejection guards
        shell: pwsh
        run: |
          ./.github/scripts/tests/Test-MatlabPromotion.ps1
          ./.github/scripts/tests/Test-CandidateProvenance.ps1
          ./.github/scripts/tests/Test-ReleaseReceiptContract.ps1
          node --test .github/scripts/tests/ReceiptGuards.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt contract guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: behavioral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-behavioral-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  compatibility:
    name: Integration compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
