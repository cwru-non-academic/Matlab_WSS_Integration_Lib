name: WSS integration compatibility
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-artifact-diagnostic:
    name: Mac packaged BLE diagnostic (arm64)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: ./.github/actions/mac-artifact-diagnostic
        with:
          read-token: ${{ steps.read.outputs.token }}
          role: wrapper
          source-root: ${{ github.workspace }}
          wrapper-root: ${{ github.workspace }}
          tools-root: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-mac-packaged-ble-diagnostic
          path: ${{ runner.temp }}/matlab-mac-artifact-diagnostic/evidence/
          if-no-files-found: warn
  behavioral-tests:
    name: Integration behavioral tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify MATLAB promotion rejection guards
        shell: pwsh
        run: |
          ./.github/scripts/tests/Test-MatlabPromotion.ps1
          ./.github/scripts/tests/Test-CandidateProvenance.ps1
          ./.github/scripts/tests/Test-ReleaseReceiptContract.ps1
          node --test .github/scripts/tests/ReceiptGuards.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt contract guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: behavioral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-behavioral-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  compatibility:
    name: Integration compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
