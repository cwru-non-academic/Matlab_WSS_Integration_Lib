name: WSS integration compatibility
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
env:
  WSS_CI_CHANNEL: dev
permissions:
  contents: read
jobs:
  selected-guard-contracts:
    name: MATLAB selected guard contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject incomplete or mutable selected evidence
        shell: pwsh
        run: |
          ./.github/scripts/tests/Test-MatlabSelectedResults.ps1
          ./.github/scripts/tests/Test-MatlabSelectedIntegrity.ps1
  behavioral-tests:
    name: Integration behavioral tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: 7d3c50cfac12107e5eca9fc7f60381a0c019ffd3
          path: .receipt-contract
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable shared release contract
        shell: pwsh
        env:
          RECEIPT_CORE_ROOT: ${{ github.workspace }}/.receipt-contract
        run: |
          node --test .github/scripts/tests/ReviewedCoreContract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Core contract differs from MATLAB receivers.' }
      - name: Verify MATLAB promotion rejection guards
        shell: pwsh
        run: |
          ./.github/scripts/tests/Test-MatlabPromotion.ps1
          ./.github/scripts/tests/Test-CandidateProvenance.ps1
          ./.github/scripts/tests/Test-MatlabNativeTestContract.ps1
          ./.github/scripts/tests/Test-MatlabFixtureProfiles.ps1
          ./.github/scripts/tests/Test-MatlabNativeIsolation.ps1
          ./.github/scripts/tests/Test-MatlabDiagnosticStaging.ps1
          ./.github/scripts/tests/Test-MatlabSelectedResults.ps1
          ./.github/scripts/tests/Test-MatlabSelectedIntegrity.ps1
          ./.github/scripts/tests/Test-ReleaseReceiptContract.ps1
          node --test .github/scripts/tests/ReceiptGuards.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt contract guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: behavioral
      - name: Reject incomplete selected suites in real MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(getenv('GITHUB_WORKSPACE'),'.github','scripts','tests')); testSelectedMatlabCompleteness;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-behavioral-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  compatibility:
    name: Integration compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  macos-native:
    name: Integration compatibility native (macOS ${{ matrix.arch }}, ${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, os: macos-15, platform: MACA64, release: R2026b}
          - {arch: x86_64, os: macos-15-intel, platform: MACI64, release: R2025b}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native committed-state MATLAB compatibility
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: wrapper
          purpose: compatibility
          matlab-release: ${{ matrix.release }}
          expected-platform: ${{ matrix.platform }}
      - name: Bind the native architecture and runtime version
        shell: pwsh
        run: ./.github/scripts/Write-MatlabMacLane.ps1 -InputPath artifacts/ci/compatibility.json -Architecture ${{ matrix.arch }} -AllowLegacy -OutputPath "$env:RUNNER_TEMP/mac-lane/compatibility.json"
      - uses: actions/create-github-app-token@v2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Verify actual copied payload BLE ABI without radio access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/mac-artifact-diagnostic
        with:
          read-token: ${{ steps.read.outputs.token }}
          role: wrapper
          source-root: ${{ github.workspace }}
          wrapper-root: ${{ github.workspace }}
          tools-root: ${{ github.workspace }}/.
          matlab-release: ${{ matrix.release }}
          expected-platform: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-compatibility-macOS-a${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-lane/compatibility.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: wrapper-mac-packaged-ble-diagnostic-a${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/matlab-mac-artifact-diagnostic/evidence/
          if-no-files-found: warn
  macos-compatibility:
    name: Integration compatibility (macOS)
    if: always()
    needs: [macos-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both native macOS lanes
        shell: pwsh
        env:
          MACOS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $needs = $env:MACOS_NEEDS_JSON | ConvertFrom-Json
          if ($needs.'macos-native'.result -cne 'success') { throw 'A native macOS lane failed, was skipped or cancelled.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wrapper-compatibility-macOS-a${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/mac-lanes
      - name: Require complete native evidence from both architectures
        shell: pwsh
        env:
          MACOS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./.github/scripts/Complete-MatlabMacCoverage.ps1 -EvidenceRoot "$env:RUNNER_TEMP/mac-lanes" -ArtifactPrefix 'wrapper-compatibility-macOS-a${{ github.run_attempt }}' -AllowLegacy -OutputPath "$env:RUNNER_TEMP/mac-coverage/compatibility.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wrapper-compatibility-macOS-evidence
          path: ${{ runner.temp }}/mac-coverage/compatibility.json
          if-no-files-found: error
